[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rome-weather-forecast"
version = "0.1.0"
description = "Pipeline ibrida ML/NWP per previsioni meteo giornaliere su Roma"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
edge = [
    "onnx>=1.15",
    "onnxruntime>=1.17",
    "skl2onnx>=1.16",
]
test = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["meteo*"]

[tool.setuptools.package-data]
meteo = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
